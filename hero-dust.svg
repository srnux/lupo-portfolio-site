<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="rough" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="4" seed="7" result="n"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="90" xChannelSelector="R" yChannelSelector="G" result="d"></feDisplacementMap>
      <feGaussianBlur in="d" stdDeviation="7"></feGaussianBlur>
    </filter>
    <filter id="rough2" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.014" numOctaves="4" seed="23" result="n"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="120" xChannelSelector="R" yChannelSelector="G" result="d"></feDisplacementMap>
      <feGaussianBlur in="d" stdDeviation="10"></feGaussianBlur>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="3"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
    </filter>
    <radialGradient id="puff" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5a565b" stop-opacity="0.95"></stop>
      <stop offset="45%" stop-color="#3d393e" stop-opacity="0.8"></stop>
      <stop offset="100%" stop-color="#171417" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="puffLight" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#7d767c" stop-opacity="0.9"></stop>
      <stop offset="55%" stop-color="#454045" stop-opacity="0.6"></stop>
      <stop offset="100%" stop-color="#14111400" stop-opacity="0"></stop>
    </radialGradient>
  </defs>

  

  <rect width="1600" height="900" fill="#0b090b"></rect>
  <g id="haze" opacity="0.5">
    <ellipse cx="1050" cy="620" rx="700" ry="340" fill="url(#puff)" opacity="0.5" filter="url(#rough)"></ellipse>
    <ellipse cx="430" cy="300" rx="520" ry="300" fill="url(#puff)" opacity="0.32" filter="url(#rough2)"></ellipse>
  </g>

  <g id="b1" class="blast" filter="url(#rough)">
    <ellipse cx="980" cy="470" rx="330" ry="280" fill="url(#puff)"></ellipse>
    <ellipse cx="1130" cy="400" rx="200" ry="180" fill="url(#puffLight)"></ellipse>
    <ellipse cx="860" cy="560" rx="230" ry="170" fill="url(#puff)"></ellipse>
  </g>

  <g id="b2" class="blast" filter="url(#rough2)">
    <ellipse cx="1280" cy="640" rx="300" ry="230" fill="url(#puff)"></ellipse>
    <ellipse cx="1180" cy="700" rx="180" ry="150" fill="url(#puffLight)"></ellipse>
  </g>

  <g id="b3" class="blast" filter="url(#rough)">
    <ellipse cx="700" cy="300" rx="290" ry="240" fill="url(#puff)"></ellipse>
    <ellipse cx="600" cy="240" rx="160" ry="140" fill="url(#puffLight)"></ellipse>
  </g>

  <g id="b4" class="blast" filter="url(#rough2)">
    <ellipse cx="1420" cy="260" rx="260" ry="220" fill="url(#puff)"></ellipse>
  </g>

  <g id="b5" class="blast" filter="url(#rough)">
    <ellipse cx="1060" cy="820" rx="340" ry="200" fill="url(#puff)"></ellipse>
    <ellipse cx="1230" cy="850" rx="200" ry="130" fill="url(#puffLight)"></ellipse>
  </g>

  <rect width="1600" height="900" filter="url(#grain)" opacity="0.09" style="mix-blend-mode:overlay"></rect>
</svg>